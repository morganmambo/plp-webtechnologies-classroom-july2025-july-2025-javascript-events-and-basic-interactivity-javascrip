<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Interactive Web Page</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Welcome to My Interactive Page</h1>
    <nav>
      <a href="#about">About</a>
      <a href="#features">Features</a>
      <a href="#contact">Contact</a>
    </nav>
  </header>

  <section id="about">
    <h2>About</h2>
    <p>This page demonstrates JavaScript interactivity and custom form validation.</p>
    <button id="changeColorBtn">Change Background Color</button>
  </section>

  <section id="features">
    <h2>Features</h2>
    <ul>
      <li>Dynamic background color change</li>
      <li>Real-time character counter</li>
      <li>Custom form validation</li>
    </ul>
    <textarea id="messageBox" placeholder="Type something..."></textarea>
    <p id="charCount">Characters: 0</p>
  </section>

  <section id="contact">
    <h2>Contact Form</h2>
    <form id="contactForm">
      <label for="name">Name:</label>
      <input type="text" id="name" name="name"><br><br>

      <label for="email">Email:</label>
      <input type="text" id="email" name="email"><br><br>

      <label for="password">Password:</label>
      <input type="password" id="password" name="password"><br><br>

      <button type="submit">Submit</button>
    </form>
    <p id="formMessage"></p>
  </section>

  <script src="script.js"></script>
</body>
</html>
